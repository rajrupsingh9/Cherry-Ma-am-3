<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <!-- Brand Purple Background Gradient -->
    <linearGradient id="brandBg192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7CF8"/>
      <stop offset="50%" stop-color="#796AEF"/>
      <stop offset="100%" stop-color="#5B4BD8"/>
    </linearGradient>

    <!-- Card Badge Gradient -->
    <linearGradient id="cardBg192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F5FF"/>
    </linearGradient>

    <!-- Mortarboard Cap Gradient -->
    <linearGradient id="capGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#796AEF"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Cherries 3D Radial Gradients -->
    <radialGradient id="cherryLeftGrad192" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FF6584"/>
      <stop offset="45%" stop-color="#F43F5E"/>
      <stop offset="80%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>

    <radialGradient id="cherryRightGrad192" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FF5277"/>
      <stop offset="45%" stop-color="#E11D48"/>
      <stop offset="80%" stop-color="#9F1239"/>
      <stop offset="100%" stop-color="#700C26"/>
    </radialGradient>

    <linearGradient id="leafGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="badgeShadow192" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#312E81" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Outer Brand Squircle Background -->
  <rect width="192" height="192" rx="44" fill="url(#brandBg192)"/>
  <rect x="4" y="4" width="184" height="184" rx="40" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Centered Floating White Squircle Badge -->
  <g filter="url(#badgeShadow192)" transform="translate(32, 32)">
    <rect width="128" height="128" rx="28" fill="url(#cardBg192)" stroke="#EEF2FF" stroke-width="1.5"/>
    <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.8"/>

    <!-- ACADEMIC MORTARBOARD CAP -->
    <!-- Cap Base Underneath -->
    <path d="M 47,48 Q 64,57 81,48 L 81,53 Q 64,62 47,53 Z" fill="#3730A3"/>
    <!-- Cap Top Diamond -->
    <polygon points="64,31 96,43 64,55 32,43" fill="url(#capGrad192)"/>
    <polygon points="64,31 96,43 64,55 32,43" fill="none" stroke="#A5B4FC" stroke-width="0.8" stroke-opacity="0.6"/>

    <!-- Golden Cap Button & Tassel -->
    <circle cx="64" cy="43" r="2.2" fill="#F59E0B"/>
    <path d="M 64,43 Q 85,46 87,55" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="85.5" y="55" width="3" height="6" rx="1" fill="#D97706"/>

    <!-- Emerald Leaves -->
    <path d="M 64,74 C 72,65 84,66 86,72 C 80,78 69,78 64,74 Z" fill="url(#leafGrad192)"/>
    <path d="M 64,74 C 56,66 46,68 45,73 C 50,78 60,77 64,74 Z" fill="url(#leafGrad192)" opacity="0.85"/>

    <!-- Stems -->
    <path d="M 64,74 C 59,86 52,94 50,98" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    <path d="M 64,74 C 69,86 75,94 78,98" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"/>

    <!-- Left Cherry Body -->
    <circle cx="49" cy="101" r="14" fill="url(#cherryLeftGrad192)"/>
    <ellipse cx="44" cy="96" rx="4.5" ry="3" fill="#FFFFFF" opacity="0.75" transform="rotate(-35 44 96)"/>

    <!-- Right Cherry Body -->
    <circle cx="78" cy="100" r="14" fill="url(#cherryRightGrad192)"/>
    <ellipse cx="73" cy="95" rx="4.5" ry="3" fill="#FFFFFF" opacity="0.75" transform="rotate(-35 73 95)"/>

    <!-- Golden AI Sparkle (Top-Right) -->
    <path d="M 102,25 Q 102,31 108,31 Q 102,31 102,37 Q 102,31 96,31 Q 102,31 102,25 Z" fill="#FBBF24"/>

    <!-- AI Violet Pulse Badge (Bottom-Left) -->
    <g transform="translate(6, 97)">
      <circle cx="8" cy="8" r="8" fill="#796AEF" stroke="#FFFFFF" stroke-width="1.5"/>
      <path d="M 8,4 Q 8,8 12,8 Q 8,8 8,12 Q 8,8 4,8 Q 8,8 8,4 Z" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
