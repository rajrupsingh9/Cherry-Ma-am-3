<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Brand Purple Background Gradient -->
    <linearGradient id="brandBg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7CF8"/>
      <stop offset="50%" stop-color="#796AEF"/>
      <stop offset="100%" stop-color="#5B4BD8"/>
    </linearGradient>

    <!-- Card Badge Gradient -->
    <linearGradient id="cardBg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F5FF"/>
    </linearGradient>

    <!-- Mortarboard Cap Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#796AEF"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Cherries 3D Radial Gradients -->
    <radialGradient id="cherryLeftGrad" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FF6584"/>
      <stop offset="45%" stop-color="#F43F5E"/>
      <stop offset="80%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>

    <radialGradient id="cherryRightGrad" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FF5277"/>
      <stop offset="45%" stop-color="#E11D48"/>
      <stop offset="80%" stop-color="#9F1239"/>
      <stop offset="100%" stop-color="#700C26"/>
    </radialGradient>

    <!-- Emerald Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#312E81" flood-opacity="0.35"/>
    </filter>
    <filter id="cherryShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#881337" flood-opacity="0.3"/>
    </filter>
    <filter id="capShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#312E81" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Brand Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#brandBg512)"/>
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.25"/>

  <!-- Centered Floating White Squircle Badge (Protected in 80% safe zone for maskable icons) -->
  <g filter="url(#badgeShadow)" transform="translate(86, 86)">
    <rect width="340" height="340" rx="76" fill="url(#cardBg512)" stroke="#EEF2FF" stroke-width="3"/>

    <!-- Subtle inner highlight ring -->
    <rect x="6" y="6" width="328" height="328" rx="70" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8"/>

    <!-- ACADEMIC MORTARBOARD CAP (Top Section) -->
    <g filter="url(#capShadow)">
      <!-- Cap Base Underneath -->
      <path d="M 125,124 Q 170,148 215,124 L 215,138 Q 170,162 125,138 Z" fill="#3730A3"/>
      <!-- Cap Top Diamond -->
      <polygon points="170,82 254,114 170,146 86,114" fill="url(#capGrad)"/>
      <polygon points="170,82 254,114 170,146 86,114" fill="none" stroke="#A5B4FC" stroke-width="1.5" stroke-opacity="0.6"/>

      <!-- Golden Cap Button & Tassel -->
      <circle cx="170" cy="114" r="5" fill="#F59E0B"/>
      <!-- Tassel Ribbon & Fringe -->
      <path d="M 170,114 Q 225,120 230,144" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
      <rect x="227" y="144" width="7" height="15" rx="3" fill="#D97706"/>
      <circle cx="230.5" cy="144" r="3.5" fill="#FBBF24"/>
    </g>

    <!-- SIGNATURE CHERRIES & LEAVES (Middle-Bottom Section) -->
    <!-- Glossy Emerald Leaves at Stems Origin -->
    <path d="M 170,195 C 190,172 222,176 226,192 C 210,208 182,206 170,195 Z" fill="url(#leafGrad)"/>
    <path d="M 170,195 C 150,175 124,180 120,194 C 135,208 160,205 170,195 Z" fill="url(#leafGrad)" opacity="0.85"/>

    <!-- Curved Stems -->
    <path d="M 170,195 C 156,228 140,248 135,258" fill="none" stroke="#059669" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 170,195 C 182,226 198,248 205,258" fill="none" stroke="#059669" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Left Cherry Body -->
    <g filter="url(#cherryShadow)">
      <circle cx="132" cy="265" r="36" fill="url(#cherryLeftGrad)"/>
      <!-- Specular Light Highlights -->
      <ellipse cx="120" cy="252" rx="12" ry="7.5" fill="#FFFFFF" opacity="0.75" transform="rotate(-35 120 252)"/>
      <circle cx="138" cy="247" r="3" fill="#FFFFFF" opacity="0.5"/>
    </g>

    <!-- Right Cherry Body -->
    <g filter="url(#cherryShadow)">
      <circle cx="206" cy="263" r="36" fill="url(#cherryRightGrad)"/>
      <!-- Specular Light Highlights -->
      <ellipse cx="194" cy="250" rx="12" ry="7.5" fill="#FFFFFF" opacity="0.75" transform="rotate(-35 194 250)"/>
      <circle cx="212" cy="245" r="3" fill="#FFFFFF" opacity="0.5"/>
    </g>

    <!-- AI GOLDEN SPARKLES -->
    <!-- Top-Right Sparkle -->
    <path d="M 270,68 Q 270,82 284,82 Q 270,82 270,96 Q 270,82 256,82 Q 270,82 270,68 Z" fill="#FBBF24"/>
    <circle cx="286" cy="104" r="2.5" fill="#F59E0B"/>

    <!-- Bottom-Left AI Violet Pulse Badge -->
    <g transform="translate(18, 260)">
      <circle cx="22" cy="22" r="20" fill="#796AEF" stroke="#FFFFFF" stroke-width="3"/>
      <!-- Inner White Sparkle Star -->
      <path d="M 22,12 Q 22,22 32,22 Q 22,22 22,32 Q 22,22 12,22 Q 22,22 22,12 Z" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
